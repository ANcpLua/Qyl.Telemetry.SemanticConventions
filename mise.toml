# The toolchain this repository builds with; `mise install` installs it.
# dotnet also keeps global.json, which dotnet itself reads.
[tools]
"node" = "24.21.0"
"dotnet" = "10.0.402"
"github:open-telemetry/weaver" = "0.28.0"
# uv runs the Python helpers of scripts/generate.sh, the gate's unittest and scripts/check-pin-freshness.py.
"uv" = "0.13.0"

[tasks.check]
description = "The gate before a push or a release; a line per step, full log in artifacts/logs, QYL_VERBOSE=1 prints everything"
quiet = true
run = '''
scripts/quiet.sh check \
  "uv run --no-project --with pyyaml python3 -m unittest discover --start-directory tests/scripts --pattern 'test_*.py'" \
  './scripts/check-generated.sh' \
  'node scripts/check-reference.mjs' \
  'npm test --prefix typescript' \
  './scripts/check-live-check-policies.sh' \
  'dotnet restore Qyl.Telemetry.SemanticConventions.slnx' \
  'dotnet build Qyl.Telemetry.SemanticConventions.slnx --no-restore --configuration Release' \
  'dotnet run --project tests/Qyl.Telemetry.SemanticConventions.Pipeline.Tests/ --configuration Release --no-build'
'''

[tasks.check-full]
description = "check, then the coverage gate: ./build.sh Coverage (pipeline tests under coverage, dotcov thresholds in eng/build/Build.cs)"
quiet = true
depends = ["check"]
run = "./build.sh Coverage"
