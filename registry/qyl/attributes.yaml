        stability: development
        brief: "First dot-segment of the attribute key a collector measurement is about."
        note: "The value set is closed and is exactly the attribute namespaces present in the resolved registry plus `other`: the collector clamps every value it records to this set, so an inbound payload carrying an unknown key cannot fork the series. `registry/policies-v2/qyl_attribute_namespace.rego` recomputes the set from the resolved catalog on every `weaver registry check` and fails it when the two disagree, so a registry that gains a namespace cannot silently leave it unlisted."
