      - id: qyl.gen_ai.tool.call.arguments_hash
        type: string
        stability: development
        brief: "Producer-supplied opaque fingerprint of normalized tool arguments for repeated-call detection."
        note: >
          Staging: upstream semantic conventions have no argument fingerprint attribute.
          Compare only within the same producer and project; hashes with different canonicalization
          or keys are not comparable. Producers should use a keyed cryptographic hash and must not
          place raw arguments in this field. Absence means repeated arguments are unknown.
        examples:
          - "5c74502b204fa7d66a0d03caf5c15960be740acd30631161095791aa8f5c47c8"
