- id: vendor.anthropic_api
  type: attribute_group
  brief: Pinned source and instrumentation-scope evidence.
  annotations:
    qyl:
      vendor:
        library: Anthropic SDK and Claude API OpenTelemetry
        version: SDK 0.135.0; API reference 2026-10-18
        repository: https://github.com/anthropics/anthropic-sdk-typescript
        ref: sdk-v0.135.0
        license: MIT; LicenseRef-Anthropic-API-Documentation
        activity_sources:
        - name: com.anthropic.sdk.typescript
          note: https://github.com/anthropics/anthropic-sdk-typescript/blob/sdk-v0.135.0/src/internal/tracing.ts#L49; INSTRUMENTATION_SCOPE.
        - name: com.anthropic.sdk.*
          note: https://platform.claude.com/docs/en/api/opentelemetry/spans#span-names-and-kinds; language and cloud-client
            scope family.
        - name: com.anthropic.claude-platform
          note: https://platform.claude.com/docs/en/api/opentelemetry/spans#span-names-and-kinds; API-side scope.
        artifact_sha256: 4f64c1e27e39734cff0eec08221b5f012b82001fda589072c93b0cbe4b65b271
        dynamic_conventions:
        - attribute_pattern: anthropic.<resource>.id
          source: https://platform.claude.com/docs/en/api/opentelemetry/spans:444
        - structured_content_attributes:
          - gen_ai.input.messages
          - gen_ai.output.messages
          message_part_fields:
          - anthropic_toolset_name
          - anthropic_mcp_server_name
          message_part_type_pattern: anthropic_<original_block_type>
          note: Fields and part-type extensions inside GenAI JSON message strings, not top-level span attributes. Unmapped
            content blocks retain only their prefixed type.
          source: https://platform.claude.com/docs/en/api/opentelemetry/spans#content-attributes
        - span_pattern: anthropic.messages.batches.<method>
          source: https://platform.claude.com/docs/en/api/opentelemetry/spans:357
        - span_pattern: anthropic.sessions.<method>
          source: https://platform.claude.com/docs/en/api/opentelemetry/spans:371
        - span_pattern: anthropic.<resources>.<method>
          source: https://platform.claude.com/docs/en/api/opentelemetry/spans:428
  attributes:
  - ref: qyl.instrumentation.domain
