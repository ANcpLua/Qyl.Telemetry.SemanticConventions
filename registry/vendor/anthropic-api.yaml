# Native Anthropic telemetry. Preserve emitted keys; upstream keys are references.
# Development denotes the vendor contract stability, not proof that a feature is enabled.
groups:
- id: registry.vendor.anthropic_api
  type: attribute_group
  display_name: Anthropic SDK and Claude API OpenTelemetry native attributes
  brief: Native telemetry fields absent from the pinned upstream registry.
  attributes:
  - id: anthropic.beta
    type: string[]
    stability: development
    brief: Anthropic beta features enabled on the API request.
    note: https://platform.claude.com/docs/en/api/opentelemetry/spans:152.
    examples:
    - - example
  - id: anthropic.content.truncated
    type: boolean
    stability: development
    brief: Whether content was shortened to fit the configured span-content limit.
    note: https://platform.claude.com/docs/en/api/opentelemetry/spans#attributes.
  - id: anthropic.deployment.id
    type: string
    stability: development
    brief: Anthropic deployment id used for producer correlation.
    note: https://github.com/anthropics/anthropic-sdk-typescript/blob/sdk-v0.135.0/src/resources/beta/deployments.ts#L86
      https://github.com/anthropics/anthropic-sdk-typescript/blob/sdk-v0.135.0/src/resources/beta/deployments.ts#L120
      https://github.com/anthropics/anthropic-sdk-typescript/blob/sdk-v0.135.0/src/resources/beta/deployments.ts#L194
