# Native Anthropic telemetry. Preserve emitted keys; upstream keys are references.
# Development denotes the vendor contract stability, not proof that a feature is enabled.
groups:
- id: vendor.claude_cowork
  type: attribute_group
  brief: Pinned source and instrumentation-scope evidence.
  annotations:
    qyl:
      vendor:
        library: Claude Desktop Cowork
        version: 2.42304.0
        repository: https://claude.com/docs/cowork/monitoring
        ref: e7f60e658f15cfece9efa384a78a39aec3c12845
        license: LicenseRef-Anthropic-Commercial-Terms
        activity_sources:
        - name: com.anthropic.claude_code
          note: https://claude.com/docs/cowork/monitoring; Cowork session engine uses the Claude Code telemetry contract.
        artifact_sha256: bfa22ac393906762fa04b9607ff202907405b089c1ae7db257159202f31bb3d0
