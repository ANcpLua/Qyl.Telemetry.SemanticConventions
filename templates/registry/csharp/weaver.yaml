whitespace_control:
  trim_blocks: true
  lstrip_blocks: true
  keep_trailing_newline: true

comment_formats:
  csharp:
    format: markdown
    prefix: "/// "
    trim: true
default_comment_format: csharp

jq_modules:
  - jq/symbols.jq

# No pin has a default here. The three schema URLs are registry facts and reach the templates
# through the filters below ($schema_urls); the Weaver version, the core tag, the core commit
# and the genai commit reach them as -D parameters that scripts/generate.sh reads out of
# Version.props and registry/manifest.yaml, and registry_snapshot_sha256 as the one it computes
# from the snapshot target's output. A bare `weaver registry generate` therefore leaves them
# unset, `lib.param` writes `error: missing param <name>` into the header instead of a stale
# value, and scripts/check-generated.sh fails on the diff.
params:
  scope_names: ""
  vendor_activity_sources: ""

templates:
  # One {Root}Attributes class per projected root name, per stability tier.
  # Roots such as sessionId and session_id share a file; merge them before emission.
  # The 25 core attributes
  # that are absent from the top-level `registry.attributes` but present under
  # `dependencies[...]` are folded in first (top-level wins).
  - template: attributes.cs.j2
    filter: >
      with_wire_keys
      | with_attribute_symbols
      | . as $registry
      | ($registry.schema_url) as $qyl
      | ([($registry.dependencies | keys)[]
           | select((($registry.dependency_graph[.]) | length) == 0)] | first) as $core
      | ([($registry.dependencies | keys)[] | select(. != $core)] | first) as $genai
      | {qyl_schema_url: $qyl, core_schema_url: $core, genai_schema_url: $genai} as $schema_urls
      | $registry
      | ([.registry.attributes[]]) as $top
      | ($top | map({key: .key, value: true}) | from_entries) as $seen
      | ([.dependencies[].registry.attributes[]] | map(select($seen[.key] | not))) as $extra
      | (($top + $extra) | sort_by(.key)) as $all
      | [ ($all
            | group_by(.key | split(".")[0] | split("_") | map((.[0:1] | ascii_upcase) + .[1:]) | join("")) | .[]
            | (.[0].key | split(".")[0]) as $root
            | ($root | split("_") | map((.[0:1] | ascii_upcase) + .[1:]) | join("")) as $p
            | {tier: "incubating", root: $root, pascal_root: $p, attributes: .,
               class_suffix: " (incubating)",
               namespace: ("Qyl.Telemetry.SemanticConventions.Incubating.Attributes." + $p),
               out_dir: "src/Qyl.Telemetry.SemanticConventions.Incubating/Generated"}),
          ($all
            | map(select(.stability == "stable" or (.deprecated != null)))
            | group_by(.key | split(".")[0] | split("_") | map((.[0:1] | ascii_upcase) + .[1:]) | join("")) | .[]
            | (.[0].key | split(".")[0]) as $root
            | ($root | split("_") | map((.[0:1] | ascii_upcase) + .[1:]) | join("")) as $p
            | {tier: "stable", root: $root, pascal_root: $p, attributes: .,
               class_suffix: "",
               namespace: ("Qyl.Telemetry.SemanticConventions.Attributes." + $p),
               out_dir: "src/Qyl.Telemetry.SemanticConventions/Generated"}) ]
      | map(. + $schema_urls)
    application_mode: each
    file_name: "{{ ctx.out_dir }}/Attributes/{{ ctx.pascal_root }}Attributes.g.cs"

  # The pinned core schema URL, in the stable package only.
  - template: schema_url.cs.j2
    filter: >
      with_wire_keys
      | . as $registry
      | ($registry.schema_url) as $qyl
      | ([($registry.dependencies | keys)[]
           | select((($registry.dependency_graph[.]) | length) == 0)] | first) as $core
      | ([($registry.dependencies | keys)[] | select(. != $core)] | first) as $genai
      | {qyl_schema_url: $qyl, core_schema_url: $core, genai_schema_url: $genai} as $schema_urls
      | $registry
      | $schema_urls
    application_mode: single
    file_name: "src/Qyl.Telemetry.SemanticConventions/Generated/SchemaUrl.g.cs"

  # The persistence rule of registry/qyl/policy.yaml (params.policy), in the stable package.
  - template: registry_policy.cs.j2
    filter: >
      with_wire_keys
      | . as $registry
      | ($registry.schema_url) as $qyl
      | ([($registry.dependencies | keys)[]
           | select((($registry.dependency_graph[.]) | length) == 0)] | first) as $core
      | ([($registry.dependencies | keys)[] | select(. != $core)] | first) as $genai
      | {qyl_schema_url: $qyl, core_schema_url: $core, genai_schema_url: $genai}
    application_mode: single
    file_name: "src/Qyl.Telemetry.SemanticConventions/Generated/RegistryPolicy.g.cs"

  # The qyl-owned telemetry names, in the stable package only: the producer packages build
  # their ActivitySource and Meter from these and may not read the incubating tier.
  - template: names.cs.j2
    filter: >
      with_wire_keys
      | . as $registry
      | ($registry.schema_url) as $qyl
      | ([($registry.dependencies | keys)[]
           | select((($registry.dependency_graph[.]) | length) == 0)] | first) as $core
      | ([($registry.dependencies | keys)[] | select(. != $core)] | first) as $genai
      | {qyl_schema_url: $qyl, core_schema_url: $core, genai_schema_url: $genai} as $schema_urls
      | $registry
      | {events: [.registry.events[]
                 | select(.provenance.path != null and (.provenance.path | startswith("registry/qyl/")))
                 | .name]}
      | . + $schema_urls
    application_mode: single
    file_name: "src/Qyl.Telemetry.SemanticConventions/Generated/Names/QylTelemetryNames.g.cs"

  # The qyl-owned instruments, in the incubating tier.
  - template: metric_attributes.cs.j2
    filter: >
      with_wire_keys
      | . as $registry
      | ($registry.schema_url) as $qyl
      | ([($registry.dependencies | keys)[]
           | select((($registry.dependency_graph[.]) | length) == 0)] | first) as $core
      | ([($registry.dependencies | keys)[] | select(. != $core)] | first) as $genai
      | {qyl_schema_url: $qyl, core_schema_url: $core, genai_schema_url: $genai} as $schema_urls
      | $registry
      | def pascal($s): $s | gsub("[_\\-]"; ".") | split(".")
                     | map(select(length > 0) | (.[0:1] | ascii_upcase) + .[1:]) | join("");
      def dedupe(f): group_by(f) | map(sort_by([(if .deprecated then 1 else 0 end), f]) | .[0]);
      [ .registry.metrics
        | map(select(.provenance.path != null and (.provenance.path | startswith("registry/qyl/"))))
        | sort_by(.name)
        | group_by(.name | split(".")[0]) | .[]
        | (.[0].name | split(".")[0]) as $root
        | ($root | split("_") | map((.[0:1] | ascii_upcase) + .[1:]) | join("")) as $p
        | {root: $root, pascal_root: $p, metrics: (. | dedupe(pascal(.name)) | sort_by(.name)),
           namespace: ("Qyl.Telemetry.SemanticConventions.Incubating.Attributes." + $p)} ]
      | map(. + $schema_urls)
    application_mode: each
    file_name: "src/Qyl.Telemetry.SemanticConventions.Incubating/Generated/Attributes/{{ ctx.pascal_root }}MetricAttributes.g.cs"

  # Typed Activity setter extensions and the value-set structs of the enum attributes, per
  # stability tier. The two packages are disjoint: the stable one carries the stable and
  # deprecated rows, the incubating one carries only what is left, under {Root}Incubating*
  # type names, so a consumer may import both namespaces without an ambiguous-call error.
  # Resolve symbols across all roots and both tiers before filtering or grouping.
  # Resource-only attributes (referenced by entities and by no span, event or metric:
  # service.name, deployment.environment.name, host.*) get no Activity setter.
  - template: activities.cs.j2
    filter: >
      with_wire_keys
      | with_attribute_symbols
      | . as $registry
      | ($registry.schema_url) as $qyl
      | ([($registry.dependencies | keys)[]
           | select((($registry.dependency_graph[.]) | length) == 0)] | first) as $core
      | ([($registry.dependencies | keys)[] | select(. != $core)] | first) as $genai
      | {qyl_schema_url: $qyl, core_schema_url: $core, genai_schema_url: $genai} as $schema_urls
      | $registry
      | ([.registry.attributes[]]) as $top
      | ($top | map({key: .key, value: true}) | from_entries) as $seen
      | ([.dependencies[].registry.attributes[]] | map(select($seen[.key] | not))) as $extra
      | (($top + $extra) | map(select(.cs_has_setter)) | sort_by(.key)) as $all
      | [ ($all
            | map(select((.stability == "stable" or (.deprecated != null)) | not))
            | group_by(.key | split(".")[0] | split("_") | map((.[0:1] | ascii_upcase) + .[1:]) | join("")) | .[]
            | (.[0].key | split(".")[0]) as $root
            | ($root | split("_") | map((.[0:1] | ascii_upcase) + .[1:]) | join("")) as $p
            | {tier: "incubating", root: $root, pascal_root: $p, type_root: ($p + "Incubating"),
               attributes: (. | sort_by(.key)),
               namespace: ("Qyl.Telemetry.SemanticConventions.Incubating.Activities"),
               out_dir: "src/Qyl.Telemetry.SemanticConventions.Incubating/Generated"}),
          ($all
            | map(select(.stability == "stable" or (.deprecated != null)))
            | group_by(.key | split(".")[0] | split("_") | map((.[0:1] | ascii_upcase) + .[1:]) | join("")) | .[]
            | (.[0].key | split(".")[0]) as $root
            | ($root | split("_") | map((.[0:1] | ascii_upcase) + .[1:]) | join("")) as $p
            | {tier: "stable", root: $root, pascal_root: $p, type_root: $p,
               attributes: (. | sort_by(.key)),
               namespace: ("Qyl.Telemetry.SemanticConventions.Activities"),
               out_dir: "src/Qyl.Telemetry.SemanticConventions/Generated"}) ]
      | map(. + $schema_urls)
    application_mode: each
    file_name: "{{ ctx.out_dir }}/Activities/{{ ctx.type_root }}Activities.g.cs"

  # MetricDefinition<TInstrument> rows, per stability tier; disjoint the same way.
  - template: metrics.cs.j2
    filter: >
      with_wire_keys
      | . as $registry
      | ($registry.schema_url) as $qyl
      | ([($registry.dependencies | keys)[]
           | select((($registry.dependency_graph[.]) | length) == 0)] | first) as $core
      | ([($registry.dependencies | keys)[] | select(. != $core)] | first) as $genai
      | {qyl_schema_url: $qyl, core_schema_url: $core, genai_schema_url: $genai} as $schema_urls
      | $registry
      | def pascal($s): $s | gsub("[_\\-]"; ".") | split(".")
                     | map(select(length > 0) | (.[0:1] | ascii_upcase) + .[1:]) | join("");
      def dedupe(f): group_by(f) | map(sort_by([(if .deprecated then 1 else 0 end), f]) | .[0]);
      ([.registry.metrics[]]) as $top
      | ($top | map({key: .name, value: true}) | from_entries) as $seen
      | ([.dependencies[].registry.metrics[]] | map(select($seen[.name] | not))) as $extra
      | (($top + $extra) | sort_by(.name)) as $all
      | [ ($all
            | map(select((.stability == "stable" or (.deprecated != null)) | not))
            | group_by(.name | split(".")[0]) | .[]
            | (.[0].name | split(".")[0]) as $root
            | ($root | split("_") | map((.[0:1] | ascii_upcase) + .[1:]) | join("")) as $p
            | {tier: "incubating", root: $root, pascal_root: $p, type_root: ($p + "Incubating"),
               metrics: (. | dedupe(pascal(.name)) | sort_by(.name)),
               namespace: "Qyl.Telemetry.SemanticConventions.Incubating.Metrics",
               out_dir: "src/Qyl.Telemetry.SemanticConventions.Incubating/Generated"}),
          ($all
            | map(select(.stability == "stable" or (.deprecated != null)))
            | group_by(.name | split(".")[0]) | .[]
            | (.[0].name | split(".")[0]) as $root
            | ($root | split("_") | map((.[0:1] | ascii_upcase) + .[1:]) | join("")) as $p
            | {tier: "stable", root: $root, pascal_root: $p, type_root: $p,
               metrics: (. | dedupe(pascal(.name)) | sort_by(.name)),
               namespace: "Qyl.Telemetry.SemanticConventions.Metrics",
               out_dir: "src/Qyl.Telemetry.SemanticConventions/Generated"}) ]
      | map(. + $schema_urls)
    application_mode: each
    file_name: "{{ ctx.out_dir }}/Metrics/{{ ctx.type_root }}Metrics.g.cs"

  # SpanDefinition<TKind> rows, per stability tier; disjoint the same way. Rows are the span
  # refinements, keyed by id and grouped by their type's root: every span type has a refinement
  # row with its own id, and a specialization (db.postgresql.client, the gen_ai skill spans)
  # keeps its own attributes instead of collapsing into its type's row. The GenAI provider
  # refinements (openai.*, anthropic.*, azure.ai.*, aws.bedrock.*) stay out on purpose.
  - template: spans.cs.j2
    filter: >
      with_wire_keys
      | . as $registry
      | ($registry.schema_url) as $qyl
      | ([($registry.dependencies | keys)[]
           | select((($registry.dependency_graph[.]) | length) == 0)] | first) as $core
      | ([($registry.dependencies | keys)[] | select(. != $core)] | first) as $genai
      | {qyl_schema_url: $qyl, core_schema_url: $core, genai_schema_url: $genai} as $schema_urls
      | $registry
      | def pascal($s): $s | gsub("[_\\-]"; ".") | split(".")
                     | map(select(length > 0) | (.[0:1] | ascii_upcase) + .[1:]) | join("");
      def dedupe(f): group_by(f) | map(sort_by([(if .deprecated then 1 else 0 end), f]) | .[0]);
      ([.refinements.spans[]
          | select(((.type | startswith("gen_ai.")) | not) or (.id | startswith("gen_ai.")))]
         | sort_by(.id)) as $all
      | [ ($all
            | map(select((.stability == "stable" or (.deprecated != null)) | not))
            | group_by(.type | split(".")[0]) | .[]
            | (.[0].type | split(".")[0]) as $root
            | ($root | split("_") | map((.[0:1] | ascii_upcase) + .[1:]) | join("")) as $p
            | {tier: "incubating", root: $root, pascal_root: $p, type_root: ($p + "Incubating"),
               spans: (. | dedupe(pascal(.id)) | sort_by(.id)),
               namespace: "Qyl.Telemetry.SemanticConventions.Incubating.Spans",
               out_dir: "src/Qyl.Telemetry.SemanticConventions.Incubating/Generated"}),
          ($all
            | map(select(.stability == "stable" or (.deprecated != null)))
            | group_by(.type | split(".")[0]) | .[]
            | (.[0].type | split(".")[0]) as $root
            | ($root | split("_") | map((.[0:1] | ascii_upcase) + .[1:]) | join("")) as $p
            | {tier: "stable", root: $root, pascal_root: $p, type_root: $p,
               spans: (. | dedupe(pascal(.id)) | sort_by(.id)),
               namespace: "Qyl.Telemetry.SemanticConventions.Spans",
               out_dir: "src/Qyl.Telemetry.SemanticConventions/Generated"}) ]
      | map(. + $schema_urls)
    application_mode: each
    file_name: "{{ ctx.out_dir }}/Spans/{{ ctx.type_root }}Spans.g.cs"

  # Span starters (Qyl.Spans, Qyl.IncubatingSpans) and span names (Qyl.SpanNames) over the same
  # span refinement rows as spans.cs.j2. Which rows get a starter, their domain, fixed values and
  # naming chains come from registry/qyl/policy.yaml (params.policy); the filter adds the
  # qyl.instrumentation.domain values the starters may stamp.
  - template: starters.cs.j2
    filter: >
      with_wire_keys
      | with_attribute_symbols
      | . as $registry
      | ($registry.schema_url) as $qyl
      | ([($registry.dependencies | keys)[]
           | select((($registry.dependency_graph[.]) | length) == 0)] | first) as $core
      | ([($registry.dependencies | keys)[] | select(. != $core)] | first) as $genai
      | {qyl_schema_url: $qyl, core_schema_url: $core, genai_schema_url: $genai} as $schema_urls
      | $registry
      | ([.refinements.spans[]
          | select(((.type | startswith("gen_ai.")) | not) or (.id | startswith("gen_ai.")))]
         | sort_by(.id)) as $all
      | ([.registry.attributes[] | select(.key == "qyl.instrumentation.domain") | .type.members[].value]) as $domains
      | [ {tier: "incubating", class_name: "IncubatingSpans",
           spans: [$all[] | select((.stability == "stable" or (.deprecated != null)) | not)],
           out_dir: "src/Qyl.Telemetry.SemanticConventions.Incubating/Generated"},
          {tier: "stable", class_name: "Spans",
           spans: [$all[] | select(.stability == "stable" or (.deprecated != null))],
           out_dir: "src/Qyl.Telemetry.SemanticConventions/Generated"} ]
      | map(. + $schema_urls + {domains: $domains})
    application_mode: each
    file_name: "{{ ctx.out_dir }}/Starters/{{ ctx.class_name }}.g.cs"

  # Typed views over SpanRecord for the starter span types, next to the starters (ADR D8).
  - template: views.cs.j2
    filter: >
      with_wire_keys
      | with_attribute_symbols
      | . as $registry
      | ($registry.schema_url) as $qyl
      | ([($registry.dependencies | keys)[]
           | select((($registry.dependency_graph[.]) | length) == 0)] | first) as $core
      | ([($registry.dependencies | keys)[] | select(. != $core)] | first) as $genai
      | {qyl_schema_url: $qyl, core_schema_url: $core, genai_schema_url: $genai} as $schema_urls
      | $registry
      | ([.refinements.spans[]
          | select(((.type | startswith("gen_ai.")) | not) or (.id | startswith("gen_ai.")))]
         | sort_by(.id)) as $all
      | [ {tier: "incubating", class_name: "IncubatingSpanViews",
           namespace: "Qyl.Telemetry.SemanticConventions.Incubating.Views",
           spans: [$all[] | select((.stability == "stable" or (.deprecated != null)) | not)],
           out_dir: "src/Qyl.Telemetry.SemanticConventions.Incubating/Generated"},
          {tier: "stable", class_name: "SpanViews",
           namespace: "Qyl.Telemetry.SemanticConventions.Views",
           spans: [$all[] | select(.stability == "stable" or (.deprecated != null))],
           out_dir: "src/Qyl.Telemetry.SemanticConventions/Generated"} ]
      | map(. + $schema_urls)
    application_mode: each
    file_name: "{{ ctx.out_dir }}/Views/{{ ctx.class_name }}.g.cs"

  - template: span_names.cs.j2
    filter: >
      with_wire_keys
      | . as $registry
      | ($registry.schema_url) as $qyl
      | ([($registry.dependencies | keys)[]
           | select((($registry.dependency_graph[.]) | length) == 0)] | first) as $core
      | ([($registry.dependencies | keys)[] | select(. != $core)] | first) as $genai
      | {qyl_schema_url: $qyl, core_schema_url: $core, genai_schema_url: $genai} as $schema_urls
      | $registry
      | {spans: ([.refinements.spans[]
                  | select(((.type | startswith("gen_ai.")) | not) or (.id | startswith("gen_ai.")))]
                 | sort_by(.id))}
      | . + $schema_urls
    application_mode: single
    file_name: "src/Qyl.Telemetry.SemanticConventions/Generated/Starters/SpanNames.g.cs"

  # EventDefinition rows, per stability tier; disjoint the same way.
  - template: events.cs.j2
    filter: >
      with_wire_keys
      | . as $registry
      | ($registry.schema_url) as $qyl
      | ([($registry.dependencies | keys)[]
           | select((($registry.dependency_graph[.]) | length) == 0)] | first) as $core
      | ([($registry.dependencies | keys)[] | select(. != $core)] | first) as $genai
      | {qyl_schema_url: $qyl, core_schema_url: $core, genai_schema_url: $genai} as $schema_urls
      | $registry
      | def pascal($s): $s | gsub("[_\\-]"; ".") | split(".")
                     | map(select(length > 0) | (.[0:1] | ascii_upcase) + .[1:]) | join("");
      def dedupe(f): group_by(f) | map(sort_by([(if .deprecated then 1 else 0 end), f]) | .[0]);
      ([.registry.events[]]) as $top
      | ($top | map({key: .name, value: true}) | from_entries) as $seen
      | ([.dependencies[].registry.events[]] | map(select($seen[.name] | not))) as $extra
      | (($top + $extra) | sort_by(.name)) as $all
      | [ ($all
            | map(select((.stability == "stable" or (.deprecated != null)) | not))
            | group_by(.name | split(".")[0]) | .[]
            | (.[0].name | split(".")[0]) as $root
            | ($root | split("_") | map((.[0:1] | ascii_upcase) + .[1:]) | join("")) as $p
            | {tier: "incubating", root: $root, pascal_root: $p, type_root: ($p + "Incubating"),
               events: (. | dedupe(pascal(.name)) | sort_by(.name)),
               namespace: "Qyl.Telemetry.SemanticConventions.Incubating.Events",
               out_dir: "src/Qyl.Telemetry.SemanticConventions.Incubating/Generated"}),
          ($all
            | map(select(.stability == "stable" or (.deprecated != null)))
            | group_by(.name | split(".")[0]) | .[]
            | (.[0].name | split(".")[0]) as $root
            | ($root | split("_") | map((.[0:1] | ascii_upcase) + .[1:]) | join("")) as $p
            | {tier: "stable", root: $root, pascal_root: $p, type_root: $p,
               events: (. | dedupe(pascal(.name)) | sort_by(.name)),
               namespace: "Qyl.Telemetry.SemanticConventions.Events",
               out_dir: "src/Qyl.Telemetry.SemanticConventions/Generated"}) ]
      | map(. + $schema_urls)
    application_mode: each
    file_name: "{{ ctx.out_dir }}/Events/{{ ctx.type_root }}Events.g.cs"

  # EntityDefinition rows, per stability tier; disjoint the same way.
  - template: entities.cs.j2
    filter: >
      with_wire_keys
      | . as $registry
      | ($registry.schema_url) as $qyl
      | ([($registry.dependencies | keys)[]
           | select((($registry.dependency_graph[.]) | length) == 0)] | first) as $core
      | ([($registry.dependencies | keys)[] | select(. != $core)] | first) as $genai
      | {qyl_schema_url: $qyl, core_schema_url: $core, genai_schema_url: $genai} as $schema_urls
      | $registry
      | def pascal($s): $s | gsub("[_\\-]"; ".") | split(".")
                     | map(select(length > 0) | (.[0:1] | ascii_upcase) + .[1:]) | join("");
      def dedupe(f): group_by(f) | map(sort_by([(if .deprecated then 1 else 0 end), f]) | .[0]);
      ([.registry.entities[]]) as $top
      | ($top | map({key: .type, value: true}) | from_entries) as $seen
      | ([.dependencies[].registry.entities[]] | map(select($seen[.type] | not))) as $extra
      | (($top + $extra) | sort_by(.type)) as $all
      | [ ($all
            | map(select((.stability == "stable" or (.deprecated != null)) | not))
            | group_by(.type | split(".")[0]) | .[]
            | (.[0].type | split(".")[0]) as $root
            | ($root | split("_") | map((.[0:1] | ascii_upcase) + .[1:]) | join("")) as $p
            | {tier: "incubating", root: $root, pascal_root: $p, type_root: ($p + "Incubating"),
               entities: (. | dedupe(pascal(.type)) | sort_by(.type)),
               namespace: "Qyl.Telemetry.SemanticConventions.Incubating.Entities",
               out_dir: "src/Qyl.Telemetry.SemanticConventions.Incubating/Generated"}),
          ($all
            | map(select(.stability == "stable" or (.deprecated != null)))
            | group_by(.type | split(".")[0]) | .[]
            | (.[0].type | split(".")[0]) as $root
            | ($root | split("_") | map((.[0:1] | ascii_upcase) + .[1:]) | join("")) as $p
            | {tier: "stable", root: $root, pascal_root: $p, type_root: $p,
               entities: (. | dedupe(pascal(.type)) | sort_by(.type)),
               namespace: "Qyl.Telemetry.SemanticConventions.Entities",
               out_dir: "src/Qyl.Telemetry.SemanticConventions/Generated"}) ]
      | map(. + $schema_urls)
    application_mode: each
    file_name: "{{ ctx.out_dir }}/Entities/{{ ctx.type_root }}Entities.g.cs"

  # Shared registry catalog and analyzer facts. Everything the analyzers need to decide whether a key,
  # metric, scope, event or GenAI span is one the pinned registry knows — derived here rather
  # than in Python, and committed like every other generated file.
  #
  # The GenAI span rules are the involved part: a base span group carries a required enum
  # discriminator (`*.operation.name` or `*.method.name`), the operation values are handed to
  # the group whose id segment matches, and whatever is left over goes to the single group that
  # matched nothing. A span refinement adds a constraint read out of its note
  # ("`gen_ai.provider.name` MUST be set to `\"anthropic\"`") and inherits its base's
  # discriminator.
  - template: registry_facts.cs.j2
    filter: >
      with_wire_keys
      | . as $registry
      | ($registry.schema_url) as $qyl
      | ([($registry.dependencies | keys)[]
           | select((($registry.dependency_graph[.]) | length) == 0)] | first) as $core
      | ([($registry.dependencies | keys)[] | select(. != $core)] | first) as $genai
      | {qyl_schema_url: $qyl, core_schema_url: $core, genai_schema_url: $genai} as $schema_urls
      | $registry
      | def genai: (.provenance.source // "") | startswith("https://opentelemetry.io/schemas/gen-ai-dev/");
      def enumvals: if ((.type | type) == "object") and (.type | has("members"))
                    then [.type.members[].value | tostring] | unique else [] end;
      def segment($id): ($id | split(".")) as $p
                        | if ($p | length) >= 2 then $p[($p | length) - 2] else $id end;
      def kindof($t):
        if ($t | type) == "object" then {kind: (if ($t.members[0].value | type) == "number" then "Integer" else "String" end), template: false}
        elif ($t | type) != "string" then {kind: "Unknown", template: false}
        else (if ($t | startswith("template[")) then {p: $t[9:-1], template: true}
              else {p: $t, template: false} end)
             | {kind: ({"string": "String", "int": "Integer", "double": "Double",
                        "boolean": "Boolean", "string[]": "StringArray", "int[]": "IntegerArray",
                        "double[]": "DoubleArray", "boolean[]": "BooleanArray",
                        "any": "Any"}[.p] // "Unknown"), template: .template}
        end;
      def required($g): [$g.attributes[] | select(.requirement_level == "required") | .key] | unique;
      def disc($g): [$g.attributes[]
                     | select(((.key | endswith(".operation.name")) or (.key | endswith(".method.name")))
                              and .requirement_level == "required"
                              and ((enumvals | length) > 0))] | first;
      ([.registry.attributes[]]) as $top
      | ($top | map({key: .key, value: true}) | from_entries) as $seen
      | ([.dependencies[].registry.attributes[]] | map(select($seen[.key] | not))) as $extra
      | (($top + $extra) | sort_by(.key)) as $all
      | ([.registry.metrics[]]) as $mtop
      | ($mtop | map({key: .name, value: true}) | from_entries) as $mseen
      | ([.dependencies[].registry.metrics[]] | map(select($mseen[.name] | not))) as $mextra
      | ($mtop + $mextra) as $allm
      | ([.registry.events[].name] + [.dependencies[].registry.events[].name] | unique) as $events
      | ([.registry.spans[] | select(genai)]) as $bases
      | ([$bases[] | select(disc(.) != null)
           | {id: .type, kind: .kind, d: disc(.), req: required(.)}]) as $withdisc
      | ([$withdisc[] | .d.key] | unique) as $dkeys
      | ([ $dkeys[] as $dk
           | ([$withdisc[] | select(.d.key == $dk)]) as $entries
           | ([$entries[] | .d | enumvals] | add | unique) as $vals
           | (if ($dk | endswith(".method.name"))
              then [$entries[] | {id: .id, values: $vals}]
              else
                ([$entries[] | . as $e | {id: $e.id,
                    values: [$vals[] | select(. == segment($e.id) or (. | split("_") | index(segment($e.id)) != null))]}]) as $m
                | ([$m[] | select((.values | length) > 0)]) as $matched
                | ([$m[] | select((.values | length) == 0) | .id]) as $unmatched
                | ($vals - ([$matched[] | .values] | add // [])) as $rest
                | ($matched + (if ($rest | length) > 0 and ($unmatched | length) == 1
                               then [{id: $unmatched[0], values: $rest}] else [] end))
              end)
           | .[] ] ) as $assign
      | ($assign | map({key: .id, value: .values}) | from_entries) as $assigned
      | ([$withdisc[] | select($assigned[.id] != null)
           | {id: .id, kind: .kind, discriminator_key: .d.key,
              discriminator_values: $assigned[.id],
              constraint_key: null, constraint_value: null, required_attributes: .req}]) as $baserules
      | ($baserules | map(select(.discriminator_key | endswith(".operation.name")))
                    | map({key: (segment(.id) + " " + .kind), value: .}) | from_entries) as $bysuffix
      | ([$bases[] | .type] | unique) as $baseids
      | ([.refinements.spans[]
           | select(genai)
           | . as $r
           | select(($baseids | index($r.id)) == null)
           | select((.note // "") | test("`[^`]+`\\s+MUST be set to\\s+`\\\\?\"[^\"`]+"))
           | ((.note) | capture("`(?<k>[^`]+)`\\s+MUST be set to\\s+`\\\\?\"(?<v>[^\"`]+)")) as $c
           | ($bysuffix[segment($r.id) + " " + $r.kind]) as $base
           | select($base != null)
           | {id: $r.id, kind: $base.kind, discriminator_key: $base.discriminator_key,
              discriminator_values: $base.discriminator_values,
              constraint_key: $c.k, constraint_value: $c.v,
              required_attributes: required($r)}]) as $refrules
      | (($baserules + $refrules)
          | sort_by([(if .constraint_key == null then 1 else 0 end), .id])) as $rules
      | {attributes: [$all[] | {key: .key, stability: .stability, deprecated: .deprecated} + kindof(.type) + {values: enumvals}],
         context_dependent_attributes: ([$registry.context_dependent_attributes[] | {key: .key} + kindof(.type)]
                                        | group_by(.key) | map({key: .[0].key, kinds: (map(.kind) | unique)})),
         metrics: ([$allm[] | {name: .name, instrument: .instrument, unit: .unit, stability: .stability, deprecated: .deprecated}] | sort_by(.name)),
         genai_token_histograms: ([$allm[] | select(genai)
                                   | select(.instrument == "histogram" and .unit == "{token}")
                                   | .name] | unique),
         event_names: $events,
         span_rules: $rules,
         genai_discriminators: ([$rules[] | .discriminator_key | select(startswith("gen_ai."))] | unique)}
      | . + $schema_urls
      | . as $facts
      | [ $facts + {target_template: "analyzer_facts.cs.j2", output_file: "src/Qyl.Telemetry.SemanticConventions.Analyzers/SemconvRegistryFacts.g.cs"},
          $facts + {target_template: "registry_value_kind.cs.j2", output_file: "src/Qyl.Telemetry.SemanticConventions/Generated/RegistryAttributeValueKind.g.cs"},
          $facts + {target_template: "registry_catalog.cs.j2", output_file: "src/Qyl.Telemetry.SemanticConventions/Generated/RegistryCatalog.g.cs"} ]
    application_mode: each
    file_name: "{{ ctx.output_file }}"

  # The typed surface the analyzers read attribute writes through: setters, value-set members,
  # starter parameters and the denied-key tokens.
  - template: analyzer_typed_surface.cs.j2
    filter: >
      with_wire_keys
      | with_attribute_symbols
      | . as $registry
      | ($registry.schema_url) as $qyl
      | ([($registry.dependencies | keys)[]
           | select((($registry.dependency_graph[.]) | length) == 0)] | first) as $core
      | ([($registry.dependencies | keys)[] | select(. != $core)] | first) as $genai
      | {qyl_schema_url: $qyl, core_schema_url: $core, genai_schema_url: $genai} as $schema_urls
      | $registry
      | ([.registry.attributes[]]) as $top
      | ($top | map({key: .key, value: true}) | from_entries) as $seen
      | ([.dependencies[].registry.attributes[]] | map(select($seen[.key] | not))) as $extra
      | {attributes: (($top + $extra) | map(select(.cs_has_setter)) | sort_by(.key)),
         spans: ([.refinements.spans[]
                  | select(((.type | startswith("gen_ai.")) | not) or (.id | startswith("gen_ai.")))]
                 | sort_by(.id))}
      | . + $schema_urls
    application_mode: single
    file_name: "src/Qyl.Telemetry.SemanticConventions.Analyzers/SemconvTypedSurface.g.cs"

  # The collector's normalize table. Renames resolve transitively to the final live key; a
  # cycle, or a rename target the registry does not know, fails generation here rather than
  # shipping a table that points at nothing.
  - template: attribute_mapping.cs.j2
    filter: >
      with_wire_keys
      | . as $registry
      | ($registry.schema_url) as $qyl
      | ([($registry.dependencies | keys)[]
           | select((($registry.dependency_graph[.]) | length) == 0)] | first) as $core
      | ([($registry.dependencies | keys)[] | select(. != $core)] | first) as $genai
      | {qyl_schema_url: $qyl, core_schema_url: $core, genai_schema_url: $genai} as $schema_urls
      | $registry
      | ([.registry.attributes[]]) as $top
      | ($top | map({key: .key, value: true}) | from_entries) as $seen
      | ([.dependencies[].registry.attributes[]] | map(select($seen[.key] | not))) as $extra
      | (($top + $extra) | sort_by(.key)) as $all
      | ($all | map({key: .key, value: true}) | from_entries) as $known
      | ($all | map(select(.deprecated.reason == "renamed") | {key: .key, value: .deprecated.renamed_to})
              | from_entries) as $direct
      | [ $direct | keys[] as $k
          | ([$k] | until((($direct[.[-1]] // null) == null) or ((. | length) > 32);
                          . + [$direct[.[-1]]])) as $chain
          | if ($chain | unique | length) != ($chain | length)
            then error("rename cycle for attribute " + $k + ": " + ($chain | join(" -> ")))
            else . end
          | ($chain[-1]) as $target
          | if ($known[$target] | not)
            then error("attribute " + $k + " is renamed to " + $target + ", which the registry does not define")
            else . end
          | {key: $k, target: $target} ] as $renames
      | {renames: ($renames | sort_by(.key)),
         obsoleted_keys: [$all[] | select(.deprecated != null and .deprecated.renamed_to == null) | .key],
         vendor_keys: [$all[] | select((.provenance.path // "") | startswith("registry/vendor/")) | .key],
         namespaces: (([$all[] | .key | split(".")[0]] + ["other"]) | unique)}
      | . + $schema_urls
    application_mode: single
    file_name: "src/Qyl.Telemetry.SemanticConventions.Incubating/Generated/Mapping/AttributeMapping.g.cs"

  # The pins, for MSBuild: registry/manifest.yaml is where they are declared, this is how the
  # build reads them. Directory.Build.props imports it.
  - template: pins.props.j2
    filter: >
      with_wire_keys
      | . as $registry
      | ($registry.schema_url) as $qyl
      | ([($registry.dependencies | keys)[]
           | select((($registry.dependency_graph[.]) | length) == 0)] | first) as $core
      | ([($registry.dependencies | keys)[] | select(. != $core)] | first) as $genai
      | {qyl_schema_url: $qyl, core_schema_url: $core, genai_schema_url: $genai} as $schema_urls
      | $registry
      | $schema_urls
    application_mode: single
    file_name: "generated/pins.props"

  # Every deprecation the registry declares. A Pipeline test cross-checks the hand-curated
  # OpenTelemetryDeprecatedSemconvCatalog.cs against it; this replaces verify_deprecated_catalog.py.
  - template: deprecations.cs.j2
    filter: >
      with_wire_keys
      | . as $registry
      | ($registry.schema_url) as $qyl
      | ([($registry.dependencies | keys)[]
           | select((($registry.dependency_graph[.]) | length) == 0)] | first) as $core
      | ([($registry.dependencies | keys)[] | select(. != $core)] | first) as $genai
      | {qyl_schema_url: $qyl, core_schema_url: $core, genai_schema_url: $genai} as $schema_urls
      | $registry
      | ([.registry.attributes[]]) as $top
      | ($top | map({key: .key, value: true}) | from_entries) as $seen
      | ([.dependencies[].registry.attributes[]] | map(select($seen[.key] | not))) as $extra
      | (($top + $extra) | sort_by(.key)) as $all
      | {renamed: [$all[] | select(.deprecated.reason == "renamed")
                   | {key: .key, renamed_to: .deprecated.renamed_to}],
         without_replacement: [$all[] | select(.deprecated != null and .deprecated.reason != "renamed") | .key],
         deprecated_values: [$all[]
           | . as $a
           | select((($a.type | type) == "object") and ($a.type | has("members")))
           | $a.type.members[] | select(.deprecated != null)
           | {key: $a.key, value: .value}]}
      | . + $schema_urls
    application_mode: single
    file_name: "src/Qyl.Telemetry.SemanticConventions.Analyzers/SemconvDeprecations.g.cs"

  # The fingerprint of the resolved registry, the TypeScript package's REGISTRY_SNAPSHOT_SHA256.
  # The template reads params.registry_snapshot_sha256 only.
  - template: registry_snapshot.cs.j2
    filter: .schema_url
    application_mode: single
    file_name: "src/Qyl.Telemetry.SemanticConventions/Generated/RegistrySnapshot.g.cs"
